name: Kindling checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # package-lock.json predates the current package.json in this imported
      # standalone app, so npm ci cannot currently reach the code checks. Use the
      # declared dependency graph here; lockfile repair stays a separate cleanup.
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      # TanStack generates routeTree.gen during the Vite build. Typecheck after
      # that generation step so router scaffold noise does not hide game errors.
      - run: npm run build:dev
      - run: npm run typecheck
      # GitHub's Ubuntu image already carries the Chromium runtime libraries used
      # here. Download the browser only; --with-deps was reinstalling fonts/APT
      # packages on every art iteration and added ~60s without changing the app.
      - run: npx playwright install chromium
      - name: Start preview server
        run: |
          npm run dev > /tmp/kindling-dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/kindling-dev.log
          exit 1
      - name: Mobile care and Journey smoke
        run: node scripts/betterment-browser-smoke.mjs http://127.0.0.1:8080/ artifacts/betterment-mobile.png
      - name: Mobile Journey return smoke
        run: node scripts/journey-return-browser-smoke.mjs http://127.0.0.1:8080/
      - name: Mobile lineage and Kindling smoke
        run: node scripts/lineage-browser-smoke.mjs http://127.0.0.1:8080/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: betterment-mobile
          path: artifacts/*.png
          if-no-files-found: ignore
