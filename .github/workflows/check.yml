name: Kindling checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # package-lock.json predates the current package.json in this imported
      # standalone app, so npm ci cannot currently reach the code checks. Use the
      # declared dependency graph here; lockfile repair stays a separate cleanup.
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      # TanStack generates routeTree.gen during the Vite build. Typecheck after
      # that generation step so router scaffold noise does not hide game errors.
      - run: npm run build:dev
      - run: npm run typecheck
