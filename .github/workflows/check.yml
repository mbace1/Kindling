name: Kindling checks

on:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build:dev
      - run: npm run typecheck
      - run: npx playwright install chromium
      - name: Start preview server
        run: |
          npm run dev > /tmp/kindling-dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/kindling-dev.log
          exit 1
      - name: Sprite inspector smoke
        run: node scripts/sprite-inspector-browser-smoke.mjs http://127.0.0.1:8080/
      - name: Mobile care and Journey smoke
        run: node scripts/betterment-browser-smoke.mjs http://127.0.0.1:8080/ artifacts/betterment-mobile.png
      - name: Mobile Journey return smoke
        run: node scripts/journey-return-browser-smoke.mjs http://127.0.0.1:8080/
      - name: Mobile lineage and Kindling smoke
        run: node scripts/lineage-browser-smoke.mjs http://127.0.0.1:8080/
      - name: Mobile combat smoke
        run: node scripts/combat-browser-smoke.mjs http://127.0.0.1:8080/
      - name: Mobile world progression smoke
        run: node scripts/world-browser-smoke.mjs http://127.0.0.1:8080/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: betterment-mobile
          path: artifacts/*.png
          if-no-files-found: ignore
